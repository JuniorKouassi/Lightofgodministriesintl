    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow">{{homeAboutEyebrow}}</p>
        <h1>{{aboutH1}}</h1>
        <p class="page-lead">{{homeAboutText}}</p>
      </div>
    </section>

    <section class="section about">
      <div class="wrap about-grid">
        <div class="logo-wrap"><img src="{{root}}assets/logo.jpg" alt="{{aboutLogoAlt}}" width="360" height="360"></div>
        <div>
          <p class="eyebrow">{{aboutVerseLabel}}</p>
          <blockquote class="big">“{{verseFull}}” <cite>{{verseRef}}</cite></blockquote>
        </div>
      </div>
    </section>

    <section class="section" id="leadership">
      <div class="wrap leader-grid">
        <figure class="leader-photo">
          <img src="{{root}}assets/pastor-osas-petra-obakpolor.jpg" alt="{{leadAlt}}" width="1200" height="980" loading="lazy">
        </figure>
        <div>
          <p class="eyebrow dark">{{leadEyebrow}}</p>
          <h2>{{leadTitle}}</h2>
          <p class="names"><strong>{{leadPastor}}</strong><br><strong>{{leadDeaconess}}</strong></p>
          <div class="cta">
            <a class="btn btn-indigo" href="{{hVisit}}">{{navVisit}}</a>
          </div>
        </div>
      </div>
    </section>
