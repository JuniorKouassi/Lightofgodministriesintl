    <section class="page-hero">
      <div class="wrap">
        <p class="eyebrow">{{giveEyebrow}}</p>
        <h1>{{giveH1}}</h1>
        <p class="page-lead">{{giveLead}}</p>
      </div>
    </section>

    <section class="section about">
      <div class="wrap">
        <blockquote class="big">“{{giveVerse}}” <cite>{{giveVerseRef}}</cite></blockquote>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2>{{giveHowTitle}}</h2>
        <div class="cards two">
          {{giveLinkCard}}
          {{giveBankCard}}
          <article class="card">
            <span class="day">{{phoneLabel}}</span>
            <h3>{{navCta}}</h3>
            <p>{{giveContactText}}</p>
            <p class="big-phone"><a href="tel:+436769465931">+43 676 9465931</a></p>
            <div class="cta">
              <a class="btn btn-indigo" href="tel:+436769465931">{{callUs}}</a>
              <a class="btn btn-whatsapp" href="{{whatsappUrl}}" target="_blank" rel="noopener">{{whatsapp}}</a>
            </div>
          </article>
        </div>
        <p class="more-on">{{giveThanks}}</p>
      </div>
    </section>
